name: release-bundles

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run install
      - run: npm run bundle
      - uses: actions/upload-artifact@v4
        with:
          name: harness-bundles
          path: dist/
